
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Embedded in HTML</title>
</head>
<body>
    <h1>JavaScript Demonstration</h1>

    <p id="message">Click the button to display a message.</p>

    <button onclick="showMessage()">Click Me</button>

    <script>
        function showMessage() {
            document.getElementById("message").innerHTML =
                "Hello World! JavaScript is embedded in HTML.";

            alert("JavaScript is working successfully!");
        }
    </script>
</body>
</html>
